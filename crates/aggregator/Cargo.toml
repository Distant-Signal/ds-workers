[package]
name = "aggregator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
health-http = { workspace = true }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { workspace = true, features = ["default", "postgres"] }
# The line catalogue, embedded (`--lines-dir` defaults to it).
ds-lines = { workspace = true }
ds-runtime = { workspace = true, features = ["default", "postgres"] }
dotenvy = "0.15.7"
# The schema gate (`ds_store::schema::wait_for_schema`, plan 1B.3).
ds-store = { workspace = true }
futures-util = "0.3"
md-5 = "0.10"
metrics = "0.24"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
zstd = "0.14"

[dev-dependencies]
async-trait = "0.1"
# Only the retention-step metric test; already in the tree via `common`.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Only the query-count tests' `SqlxQueryCounter` layer; the binary's own
# subscriber is `ds_runtime::logging`.
tracing-subscriber = "0.3.23"

[lints]
workspace = true
