[package]
name = "notifier"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
health-http = { workspace = true }
anyhow = "1.0.102"
# VAPID key parsing (`vapid_key`): raw base64/base64url keys and the
# public-key check. Same version `api` already uses, so no new crate.
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { workspace = true, features = ["default", "postgres"] }
ds-runtime = { workspace = true, features = ["default", "postgres"] }
dotenvy = "0.15.7"
# The schema gate (`ds_store::schema::wait_for_schema`, plan 1B.3).
ds-store = { workspace = true }
futures-util = "0.3"
# Outbound webhooks (`webhook`): the generic preset's HMAC-SHA256 signature
# and delivery id. Same versions Cargo.lock already holds.
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
url = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
metrics = "0.24"
tracing = "0.1.44"
# No client feature at all: `default-features = false` drops the default
# `isahc-client` (a libcurl wrapper), and `hyper-client` is no longer used
# either -- sends go through `reqwest` below via web-push's own
# client-agnostic `request_builder` (see `send.rs::send_message` for why:
# L9, the transport's resolver must enforce the SSRF guard itself).
web-push = { version = "0.11", default-features = false }
# The push transport itself (L9 follow-up): `ds-runtime`'s public-only-resolver
# client. Same version/features `ds-runtime` already builds, so no new crate.
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
# `web_push::request_builder::build_request`/`parse_response` speak
# http 0.2 types; same `0.2` web-push itself pins.
http = "0.2"

[dev-dependencies]
# The shared DB-test fixtures (`ds_store::test_support`: `FixtureCleanup`,
# `assert_synthetic_date`) for `settings_db_tests`.
ds-store = { workspace = true, features = ["test-support"] }
# `PUSH_SEND_TIMEOUT` regression test (M2, 2026-09 security/bug review):
# a local wiremock server whose delayed response outlasts a short injected
# per-attempt timeout. Same version `common` already uses.
wiremock = "0.6"
# Paused (virtual) time for push-queue tests with time bounds
# (`#[tokio::test(start_paused = true)]`), so no test asserts on wall-clock
# time a loaded CI runner can blow. Same tokio, one more feature.
tokio = { version = "1.52.3", features = ["test-util"] }
# Only the query-count tests' `SqlxQueryCounter` layer; the binary's own
# subscriber is `ds_runtime::logging`.
tracing-subscriber = "0.3.23"
# The stale line-history counter's test (ingest plan 3c.4) reads a local
# recorder. Already in Cargo.lock, at the version the other crates use.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[features]
# Test-only (DS-415): `webhook::WebhookSender::unguarded_for_tests`, a sender
# without the public-address guard, so `webhook_e2e_tests` can reach real
# ntfy and Gotify servers on 127.0.0.1. Off by default, and a release build
# with it fails to compile (main.rs), so no image can ship it.
insecure-test-egress = []

[lints]
workspace = true
