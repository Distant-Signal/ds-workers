# cargo-deny: licences, advisories, bans and sources. CI's `cargo-deny` job
# (ci.yml) runs `cargo deny --locked check` for bans, licenses, sources and
# advisories as blocking checks (a new RustSec advisory or yanked crate fails
# CI), and `cargo deny --locked fetch` as a blocking step.
# Baseline: a strict deny.toml.

[graph]
all-features = true

[advisories]
# Overlap, kept on purpose: dependency-scan.yml's OSV scan already reports
# RustSec advisories for Cargo.lock (and npm, and images), and blocks on
# critical + fixable ones. This section reports the same database, plus
# yanked crates, which OSV doesn't check, and gates CI on them (advisories
# v2 has no severity threshold). It clones the advisory DB from github.com,
# which GitHub-hosted CI can reach.
version = 2
yanked = "deny"
# Each ignore needs a reason and a `# expires YYYY-MM-DD` date (ci's
# check-deny-ignores.py step fails an undated or expired one).
ignore = [
    # rsa: Marvin timing attack on private-key operations (RUSTSEC-2023-0071);
    # patched only in rsa >= 0.10.0. Pulled in by
    # sqlx-mysql (sqlx's MySQL driver, a lockfile-only dependency of
    # sqlx-macros-core; unused) and superboring, via jwt-simple and web-push,
    # which signs VAPID with ES256, so no RSA private-key operation is
    # reachable.
    # Re-read at the date: bump rsa when its dependents allow, else renew.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 via sqlx-mysql (unused) and web-push's jwt-simple (VAPID is ES256); patched only in rsa 0.10" }, # expires 2027-05-17
    # crypto-bigint 0.5: constant-time operations may branch on secrets
    # (fixed in 0.7.6). Only via web-push 0.11 -> jwt-simple 0.12 ->
    # p256 0.13, with no newer web-push. The full reasoning, and the
    # 2027-02-05 review date, are in osv-scanner.toml (DS-337).
    { id = "RUSTSEC-2026-0387", reason = "only via web-push's VAPID signing; no web-push release on crypto-bigint 0.7; see osv-scanner.toml" }, # expires 2027-02-05
    # chrono and chrono-tz: informational "unmaintained" advisories
    # (RUSTSEC-2026-0543, RUSTSEC-2026-0555), not vulnerabilities. All
    # versions are affected and no patched release exists. chrono is a
    # direct dependency across the Distant-Signal Rust repositories, plus
    # the sqlx, schemars and ts-rs integrations; the advisory suggests
    # jiff or time, but a move is a cross-repo effort. Revisit before the
    # expiry: migrate if a plan exists, else re-read the advisory and renew.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (informational, no patched version); a move to jiff or time is a cross-repo effort" }, # expires 2027-02-17
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained (informational, no patched version); a move to jiff or time is a cross-repo effort" }, # expires 2027-02-17
    # humantime: informational "unmaintained" advisory (RUSTSEC-2026-0542).
    # Transitive only, via object_store (the aggregator's S3 archive), which
    # requires it unconditionally. Upstream fix: apache/arrow-rs-object-store
    # #908 (humantime to jiff), unmerged. Re-read at the date: bump
    # object_store once released, else renew.
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained (informational, no patched version); transitive only, via object_store (aggregator S3 archive); upstream fix apache/arrow-rs-object-store#908 (humantime to jiff) unmerged; bump object_store when released" }, # expires 2027-02-17
]

[licenses]
version = 2
allow = [
    # The workspace's own licence (Cargo.toml [workspace.package]). Not
    # needed while [licenses.private] ignores the unpublished crates, but it
    # makes the own-licence policy explicit (repo split spec §6).
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Not in the guide's list: webpki-roots / webpki-root-certs (via reqwest
    # and rustls) ship Mozilla's root certificates under this permissive
    # data licence.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# The workspace's own crates are AGPL-3.0-or-later; publish = false
# (inherited from [workspace.package]) is what lets this skip them. Every
# dependency's licence above is compatible with the AGPL.
[licenses.private]
ignore = true

[bans]
# Duplicates are reported, not failed: 46 crates have more than one version
# today (reqwest 0.12 and 0.13, rand, base64, windows-sys, ...), and fixing
# them means upstream bumps. Tighten to "deny" once the tree is clean.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version, which
# `wildcards` would otherwise flag.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only: this repo
# has no .cargo/config.toml registries and no crate comes from elsewhere.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The core crates (repo split spec §5.2): git dependencies on the public
# ds-core repository, pinned by tag. Nothing else may come from git.
allow-git = ["https://github.com/Distant-Signal/ds-core"]
